name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "scripts/releaseGuard.mjs"
      - "scripts/releaseNotes.mjs"
      - ".github/workflows/release.yml"

# Read-only by default. Each job asks for what it writes: the build job comments on
# pull requests, and only the release job, behind the `releases` environment,
# creates the release and starts the npm publish.
permissions:
  contents: read

jobs:
  # Runs on release tags only, read-only and with no environment: a tag that does not
  # point at a commit on main stops here, before a reviewer is asked to approve. main
  # only takes reviewed pull requests, so this keeps every release on reviewed code.
  guard:
    name: Guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        shell: bash
        run: |
          set -euo pipefail
          # Peeled, so an annotated tag is checked by the commit it points at.
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${commit}, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} points at ${commit}, which is on main."

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so the release guard can find the previous tag
          # and diff the range for cross-package changes.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      - name: Guard release scope
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bun scripts/releaseGuard.mjs release --tag "${GITHUB_REF_NAME}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for pkg in packages/*; do
            [ -f "$pkg/package.json" ] || continue
            grep -q '"file:' "$pkg/package.json" || continue
            grep -oP '"[^"]+": "file:\K[^"]+' "$pkg/package.json" | while read -r dep; do
              name=$(jq -r .name "$pkg/$dep/package.json")
              scope_dir="$pkg/node_modules/$(dirname "$name")"
              mkdir -p "$scope_dir"
              ln -sfn "$(cd "$pkg/$dep" && pwd)" "$pkg/node_modules/$name"
            done
          done

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
            TAG=""
          fi

          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Write release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/releaseNotes.mjs body > release-body.md

      - name: Upload release body
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release-body.md
          retention-days: 7

      - name: Build CLI (capture output)
        id: build
        continue-on-error: true
        working-directory: packages/cli
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$GITHUB_WORKSPACE/release-build-output.txt"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-output
          path: release-build-output.txt
          retention-days: 7

      - name: Prepare package
        if: steps.build.outcome == 'success'
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bin
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          jq 'del(.private)' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Pack
        if: steps.build.outcome == 'success'
        working-directory: packages/cli
        run: npm pack

      - name: Verify declared exports are packed
        if: steps.build.outcome == 'success'
        working-directory: packages/cli
        run: bun run verify:pack

      - name: Upload CLI artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-${{ steps.version.outputs.version }}
          path: packages/cli/*.tgz
          retention-days: 7

      - name: Process results
        id: result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "status=Passed" >> "${GITHUB_OUTPUT}"
            echo "details=Build succeeded" >> "${GITHUB_OUTPUT}"
          else
            echo "status=Failed" >> "${GITHUB_OUTPUT}"
            echo "details=Package build failed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update PR comment
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Release
          STATUS: ${{ steps.result.outputs.status }}
          DETAILS: ${{ steps.result.outputs.details }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const status = process.env.STATUS;
            const details = process.env.DETAILS;
            const version = process.env.VERSION;
            const runUrl = process.env.RUN_URL;
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            let output = "";
            try {
              output = fs.readFileSync("release-build-output.txt", "utf8");
            } catch (_) {
              output = "(release-build-output.txt not found)";
            }

            const MAX_CHARS = 60000;
            if (output.length > MAX_CHARS) {
              output = ["(truncated; showing last " + MAX_CHARS + " chars)", "", output.slice(-MAX_CHARS)].join("\n");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || "";

              const lines = tableSection.split("\n");
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== "Check" && !name.startsWith(":")) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong>.*?<\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            const resultText = status === "Passed" ? "Passed" : "Failed";
            rows[section] = `[${resultText}](${runUrl})`;

            if (status === "Passed") {
              const installInstructions = [
                "**Test this PR**",
                "",
                "Download artifact (GitHub CLI required):",
                "```bash",
                `gh run download ${runId} -n cli-release-${version} -R ${repoFull}`,
                "```",
                "",
                "Install globally:",
                "```bash",
                `npm install -g ./parity-dotns-cli-${version}.tgz`,
                "```",
                "",
                "Verify:",
                "```bash",
                "dotns --help",
                "```"
              ].join("\n");

              existingDetails[section] = [
                `<details>`,
                `<summary><strong>${section}</strong> - ${resultText}</summary>`,
                "",
                installInstructions,
                "",
                "</details>",
              ].join("\n");
            } else {
              existingDetails[section] = [
                `<details>`,
                `<summary><strong>${section}</strong> - ${resultText}</summary>`,
                "",
                details || "Failed",
                "",
                `[View run](${runUrl})`,
                "",
                "```text",
                output,
                "```",
                "</details>",
              ].join("\n");
            }

            const order = ["Lint", "Lint (UI)", "Format", "Format (UI)", "Typecheck", "Typecheck (UI)", "Build", "Build (UI)", "Release", "Deploy UI", "Deploy Example", "Benchmark UI", "PR Title", "Labels", "Test"];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ["Lint", "Lint (UI)", "Format", "Format (UI)", "Typecheck", "Typecheck (UI)", "Build", "Build (UI)", "Release", "Deploy UI", "Deploy Example", "Benchmark UI", "PR Title", "Labels", "Test"];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join("\n\n")}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [guard, build]
    runs-on: ubuntu-latest
    # Publishing waits for a reviewer to approve the `releases` environment.
    environment: releases
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-release-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Download release body
        uses: actions/download-artifact@v4
        with:
          name: release-body

      # The body is generated: the supported dotNS protocol releases and networks.
      # GitHub appends the merged pull requests below it, grouped by .github/release.yml.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

      - name: Trigger NPM Release
        if: needs.build.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run npm-release.yml \
            --ref main \
            -f "tag=${{ needs.build.outputs.tag }}" \
            -R "${{ github.repository }}"
